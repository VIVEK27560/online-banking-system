<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Banking System</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <div class="App">

        <div class="navbar">

            <h1 class="heading">Online Banking System</h1>

            <p class="welcome">Welcome to Online Banking</p>

            <div class="options">

                <button onclick="openModule('../Billpayments/html/billpayment.html')">
                    <span>💳</span>
                    <h2>Bill Payments</h2>
                    <p>Pay electricity, phone, internet, DTH and other bills.</p>
                </button>

                <button onclick="openModule('../History/history.html')">
                    <span>📄</span>
                    <h2>Transaction History</h2>
                    <p>View your previous bill payments and transactions.</p>
                </button>

                <button onclick="openModule('../Loanfrom/loanapp.html')">
                    <span>🏦</span>
                    <h2>Loan Request</h2>
                    <p>Apply for a loan and submit your loan application.</p>
                </button>

                <button onclick="openModule('../account/Accountmanagment.html')">
                    <span></span>
                    <h2> Manage accountd</h2>
                    <p>Manage your account here</p>
                </button>

                <button onclick="openModule('../funds/Fundtransfer.html')">
                    <span></span>
                    <h2>Funds Transfer</h2>
                    <p>Pay Amount to any one.</p>
                </button>

                <button onclick="openModule('../New folder/Transactionhistory.html')">
                    <span></span>
                    <h2>History</h2>
                    <p>Check you history here.</p>
                </button>

            </div>

            <button class="logout" onclick="logout()">Logout</button>

        </div>

    </div>

    <script src="home.js"></script>

</body>
</html>
