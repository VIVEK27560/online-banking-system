<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
    <link rel="stylesheet" href="Transactionhistory.css">
</head>

<body>

<div class="container">

    <h1>Transaction History</h1>

    <div class="filters">

        <input
            type="text"
            id="search"
            placeholder="Search transaction..."
        >

        <select id="typeFilter">

            <option value="All">
                All Transactions
            </option>

            <option value="Credit">
                Credit
            </option>

            <option value="Debit">
                Debit
            </option>

        </select>

    </div>

    <table>

        <thead>

            <tr>
                <th>Date</th>
                <th>Transaction ID</th>
                <th>Description</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Status</th>
            </tr>

        </thead>

        <tbody id="transactionTable">

        </tbody>

    </table>

</div>

<script src="Transactionhistory.js"></script>

</body>
</html>
