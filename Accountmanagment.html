<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management</title>
    <link rel="stylesheet" href="Accountmanagment.css">
</head>

<body>

<div class="container">

    <h1>Account Management</h1>

    <div class="accounts">

        <div class="account-card">
            <h2>Savings Account</h2>
            <p>Account Number: 2500031161</p>
            <p>Account Holder: Bhanu Teja</p>

            <h3>Balance: ₹1,00,000</h3>

            <span class="active">Active</span>
        </div>

        <div class="account-card">
            <h2>Current Account</h2>
            <p>Account Number: 2500031161</p>
            <p>Account Holder: Bhanu Teja</p>
            <h3>Balance: ₹4,00,000</h3>
            <span class="active">Active</span>
        </div>
    </div>
    <div class="overview">

        <h2>Account Overview</h2>
        <div class="overview-box">
            <div>
                <h3>Total Accounts</h3>
                <p id="totalAccounts">2</p>
            </div>
            <div>
                <h3>Total Balance</h3>
                <p id="totalBalance">₹65,000</p>
            </div>
            <div>
                <h3>Status</h3>
                <p>Active</p>
            </div>
        </div>
    </div>
</div>

<script src="Accountmanagment.js"></script>

</body>
</html>
